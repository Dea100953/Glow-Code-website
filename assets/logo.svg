<!-- Simple SVG mockup for HerVoice logo: silhouette + sound wave -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="60" viewBox="0 0 240 60" role="img" aria-label="HerVoice logo">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6fa3"/>
      <stop offset="1" stop-color="#e64a88"/>
    </linearGradient>
  </defs>
  <!-- silhouette circle -->
  <g transform="translate(0,5)">
    <circle cx="30" cy="25" r="18" fill="#fff0f6" stroke="url(#g1)" stroke-width="2"/>
    <!-- simple female silhouette: head + neck -->
    <ellipse cx="30" cy="18" rx="6" ry="6" fill="#e64a88"/>
    <path d="M22 30 q8 8 16 0 v-6 q-8 6 -16 6" fill="#e64a88"/>
    <!-- sound wave -->
    <path d="M52 22 q6 -10 12 0 q6 10 12 0" stroke="url(#g1)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(80,34)">
    <text x="0" y="-6" font-family="Inter, Arial" font-size="20" font-weight="700" fill="#222">HerVoice</text>
    <text x="0" y="12" font-family="Inter, Arial" font-size="11" fill="#666">From silence to power</text>
  </g>
</svg>
